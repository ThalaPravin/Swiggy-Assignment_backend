services:
  - type: web
    name: swiggy-dineout-sentinel-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
